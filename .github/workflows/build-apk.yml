name: Build FRIDAY Android Helper APK

on:
  push:
    paths:
      - 'android-helper/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Debug APK
        working-directory: ./android-helper
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FridayGamingBridge-Touch-APK
          path: android-helper/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        with:
          tag_name: android-helper-v1.0.0
          name: FRIDAY Gaming Bridge APK v1.0.0
          body: |
            ⚡ **FRIDAY Gaming Bridge (Android Helper APK)**
            - Zero-ADB Native Free Fire Co-Pilot
            - Accessibility Service (`dispatchGesture`) support
            - Automatic AFK & Drag-Headshot bridge
          files: android-helper/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
