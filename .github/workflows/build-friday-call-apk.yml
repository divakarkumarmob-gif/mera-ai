name: Build & Package FRIDAY Call Android APK (Real Calling App)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-call-apk:
    name: Build FRIDAY Call APK (FRIDAY_Call.apk)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Required for Capacitor 7 / Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies & Capacitor CLI
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ⚡ Build Web Assets (Vite Production Build)
        run: npm run build
        env:
          VITE_BACKEND_URL: https://mera-ai-3496.onrender.com

      - name: 📱 Initialize & Sync Capacitor Android Calling Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🛠️ Fix Kotlin Duplicate Classes & Configure Gradle
        run: |
          # 1. Enable Jetifier & AndroidX in gradle.properties
          PROP="android/gradle.properties"
          if [ -f "$PROP" ]; then
            echo "android.enableJetifier=true" >> "$PROP"
            echo "android.useAndroidX=true" >> "$PROP"
          fi

          # 2. Add Kotlin stdlib resolution constraints to android/app/build.gradle
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            printf "\nconfigurations.all {\n    resolutionStrategy {\n        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'\n        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'\n        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'\n    }\n}\n\ndependencies {\n    constraints {\n        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {\n            because('kotlin-stdlib-jdk7 is now part of kotlin-stdlib')\n        }\n        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {\n            because('kotlin-stdlib-jdk8 is now part of kotlin-stdlib')\n        }\n    }\n}\n" >> "$APP_GRADLE"
          fi

      - name: 🔑 Configure Calling Permissions & Android Telecom/Audio in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            PERMS='    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_PHONE_CALL" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />'
            
            sed -i '/android.permission.INTERNET/d' "$MANIFEST"
            sed -i '/android.permission.RECORD_AUDIO/d' "$MANIFEST"
            sed -i '/<application/i '"$PERMS"'' "$MANIFEST"

            SERVICE_TAG='        <service\n            android:name=".FridayCallForegroundService"\n            android:foregroundServiceType="microphone|mediaPlayback|phoneCall"\n            android:exported="false" />'
            if ! grep -q "FridayCallForegroundService" "$MANIFEST"; then
              sed -i '/<\/application>/i '"$SERVICE_TAG"'' "$MANIFEST"
            fi
          fi

      - name: 🛡️ Inject FridayCallForegroundService in Android App
        run: |
          PACKAGE_DIR="android/app/src/main/java/com/friday/ai"
          mkdir -p "$PACKAGE_DIR"

          cat << 'EOF' > "$PACKAGE_DIR/FridayCallForegroundService.java"
          package com.friday.ai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          public class FridayCallForegroundService extends Service {
              public static final String CHANNEL_ID = "friday_calling_channel";
              public static final int NOTIFICATION_ID = 2002;
              public static final String ACTION_START = "ACTION_START";
              public static final String ACTION_STOP = "ACTION_STOP";

              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  acquireLocks();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopForeground(true);
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  Notification notification = buildCallingNotification();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      int serviceType = ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          serviceType |= ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK;
                      }
                      startForeground(NOTIFICATION_ID, notification, serviceType);
                  } else {
                      startForeground(NOTIFICATION_ID, notification);
                  }

                  return START_STICKY;
              }

              private void acquireLocks() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "FridayCall::WakeLock");
                          wakeLock.acquire(12 * 60 * 60 * 1000L);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void releaseLocks() {
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) {
                          wakeLock.release();
                          wakeLock = null;
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private Notification buildCallingNotification() {
                  Intent launchIntent = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      launchIntent != null ? launchIntent : new Intent(),
                      PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0)
                  );

                  return new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("📞 FRIDAY AI Live Call Active")
                      .setContentText("🎙️ Real-time encrypted voice conversation in progress...")
                      .setSmallIcon(android.R.drawable.ic_menu_call)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .build();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "FRIDAY Live Call Service",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setDescription("Maintains live voice call connection with Friday AI");
                      channel.setSound(null, null);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  releaseLocks();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: 🔨 Build Debug Call APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare & Rename FRIDAY_Call.apk
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/FRIDAY_Call.apk
          echo "FRIDAY_Call.apk size:"
          ls -lh apk-output/FRIDAY_Call.apk

      - name: 📤 Upload Downloadable FRIDAY_Call.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Call-Android-APK
          path: apk-output/FRIDAY_Call.apk
          retention-days: 30

      - name: 🚀 Attach FRIDAY_Call.apk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/FRIDAY_Call.apk
          name: FRIDAY AI Call App Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
