name: Build & Package FRIDAY Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (FRIDAY.apk)
    runs-on: ubuntu-latest

    steps:
      - name: ðŸ“¥ Checkout Repository
        uses: actions/checkout@v4

      - name: â˜• Setup Java 21 (Required for Capacitor 7 / Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ðŸ¤– Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: ðŸŸ¢ Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ðŸ“¦ Install Dependencies & Capacitor CLI
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: âš¡ Build Web Assets (Vite Production Build)
        run: npm run build
        env:
          VITE_BACKEND_URL: https://mera-ai-3496.onrender.com

      - name: ðŸ“± Initialize & Sync Capacitor Android Project
        run: |
          npm uninstall capacitor-wifi --no-save || true
          rm -rf node_modules/capacitor-wifi || true
          npx cap add android || true
          npx cap sync android

      - name: ðŸ”§ Fix Background-Runner AAR (android-js-engine-release.aar)
        run: |
          # capacitor-background-runner needs android-js-engine-release.aar in two locations.
          # cap sync doesn't always place it correctly in CI â€” fix manually.
          AAR_SRC=$(find node_modules/@capacitor/background-runner -name "android-js-engine-release.aar" 2>/dev/null | head -1)
          echo "AAR source: $AAR_SRC"

          if [ -n "$AAR_SRC" ]; then
            # Location 1: cordova-android-plugins libs
            mkdir -p android/capacitor-cordova-android-plugins/src/android/libs
            cp "$AAR_SRC" android/capacitor-cordova-android-plugins/src/android/libs/android-js-engine-release.aar
            echo "âœ… Copied AAR â†’ cordova-android-plugins/libs"

            # Location 2: app/libs (fallback lookup)
            mkdir -p android/app/libs
            cp "$AAR_SRC" android/app/libs/android-js-engine-release.aar
            echo "âœ… Copied AAR â†’ app/libs"
          else
            echo "âš ï¸ android-js-engine-release.aar not found in node_modules â€” background-runner may be missing"
            find node_modules/@capacitor/background-runner -type f 2>/dev/null | head -20 || true
          fi

          # Also ensure local.properties has sdk.dir set (needed in some CI environments)
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "âœ… local.properties written: sdk.dir=$ANDROID_HOME"

      - name: ðŸ› ï¸ Fix Gradle â€” Revert AGP & Force Compatible androidx.core Version
        run: |
          APP_GRADLE="android/app/build.gradle"
          ROOT_GRADLE="android/build.gradle"
          VARS_GRADLE="android/variables.gradle"
          PROP="android/gradle.properties"

          # â”€â”€ 1. Jetifier & AndroidX â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
          if [ -f "$PROP" ]; then
            grep -q "android.enableJetifier" "$PROP" || echo "android.enableJetifier=true" >> "$PROP"
            grep -q "android.useAndroidX"    "$PROP" || echo "android.useAndroidX=true"    >> "$PROP"
          fi

          # â”€â”€ 2. Revert AGP to 8.7.2 (stable, compileSdk 35 compatible) â”€â”€â”€â”€â”€â”€â”€â”€
          # Root cause: core-ktx:1.17.0 needs AGP 8.9.1+ but that chain of
          # upgrades is fragile. Instead we pin core-ktx to 1.13.1 (step 4).
          if [ -f "$ROOT_GRADLE" ]; then
            sed -i "s/com.android.tools.build:gradle:[0-9.]\+/com.android.tools.build:gradle:8.7.2/g" "$ROOT_GRADLE"
            echo "âœ… AGP pinned â†’ 8.7.2"
          fi

          # â”€â”€ 3. Keep compileSdk at 35, bump minSdk to 24 â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
          # android-js-engine-release (used by capacitor-background-runner) requires minSdk 24
          if [ -f "$VARS_GRADLE" ]; then
            sed -i 's/compileSdkVersion\s*=\s*[0-9]\+/compileSdkVersion = 35/g' "$VARS_GRADLE"
            sed -i 's/targetSdkVersion\s*=\s*[0-9]\+/targetSdkVersion = 35/g'   "$VARS_GRADLE"
            sed -i 's/minSdkVersion\s*=\s*[0-9]\+/minSdkVersion = 24/g'         "$VARS_GRADLE"
            echo "âœ… variables.gradle â†’ compileSdkVersion=35, targetSdkVersion=35, minSdkVersion=24"
            cat "$VARS_GRADLE"
          fi
          # Also patch app/build.gradle in case literals exist there
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/compileSdk\s\+[0-9]\+/compileSdk 35/g'                 "$APP_GRADLE"
            sed -i 's/compileSdkVersion\s\+[0-9]\+/compileSdkVersion 35/g'         "$APP_GRADLE"
            sed -i 's/targetSdk\s\+[0-9]\+/targetSdk 35/g'                   "$APP_GRADLE"
            sed -i 's/targetSdkVersion\s\+[0-9]\+/targetSdkVersion 35/g'           "$APP_GRADLE"
            sed -i 's/minSdk\s\+[0-9]\+/minSdk 24/g'                         "$APP_GRADLE"
            sed -i 's/minSdkVersion\s\+[0-9]\+/minSdkVersion 24/g'                 "$APP_GRADLE"
          fi

          # â”€â”€ 4. Force core-ktx:1.13.1 â€” KEY FIX â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
          # core-ktx:1.17.0 (pulled by capacitor plugins) needs AGP 8.9.1+
          # and compileSdk 36 â€” way too new. Pin to 1.13.1 which is:
          #   âœ… compileSdk 35 compatible
          #   âœ… AGP 8.7.x compatible
          #   âœ… Production stable (used by millions of apps)
          if [ -f "$APP_GRADLE" ]; then
            printf '\n// FRIDAY CI: Dependency Version Resolution Fixes\nconfigurations.all {\n    resolutionStrategy {\n        force '\''androidx.core:core-ktx:1.13.1'\''\n        force '\''androidx.core:core:1.13.1'\''\n        force '\''org.jetbrains.kotlin:kotlin-stdlib:1.8.22'\''\n        force '\''org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'\''\n        force '\''org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'\''\n    }\n}\ndependencies {\n    constraints {\n        implementation('\''org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'\'') {\n            because('\''kotlin-stdlib-jdk7 is now part of kotlin-stdlib'\'')\n        }\n        implementation('\''org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'\'') {\n            because('\''kotlin-stdlib-jdk8 is now part of kotlin-stdlib'\'')\n        }\n    }\n}\n' >> "$APP_GRADLE"
            echo "âœ… Resolution strategy written â†’ core-ktx:1.13.1 + kotlin-stdlib:1.8.22"
          fi


          # â”€â”€ 5. Verify final state â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
          echo "â”€â”€ android/build.gradle (AGP version) â”€â”€"
          grep "com.android.tools.build" "$ROOT_GRADLE" || true
          echo "â”€â”€ android/variables.gradle â”€â”€"
          cat "$VARS_GRADLE" 2>/dev/null || echo "(not found)"

      - name: ðŸ”‘ Configure Permissions & Android 14/15 Foreground Service in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # 0. Ensure xmlns:tools exists & add overrideLibrary for android-js-engine
            if ! grep -q "xmlns:tools" "$MANIFEST"; then
              sed -i 's/<manifest /<manifest xmlns:tools="http:\/\/schemas.android.com\/tools" /' "$MANIFEST"
            fi
            OVERRIDE_SDK='    <uses-sdk tools:overrideLibrary="com.capacitorjs.android_js_engine" />'
            sed -i '/<application/i '"$OVERRIDE_SDK"'' "$MANIFEST"

            # 1. Add All Required Android Permissions (100% Android 14/15 Compliant)
            PERMS='    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />'
            
            # Remove any duplicate permissions before re-injecting
            sed -i '/android.permission.INTERNET/d' "$MANIFEST"
            sed -i '/android.permission.RECORD_AUDIO/d' "$MANIFEST"
            sed -i '/android.permission.SEND_SMS/d' "$MANIFEST"
            sed -i '/android.permission.RECEIVE_SMS/d' "$MANIFEST"
            sed -i '/android.permission.READ_SMS/d' "$MANIFEST"

            # Add SEND_SMS / RECEIVE_SMS permissions for zero-cost SMS location fallback
            SMS_PERMS='    <uses-permission android:name="android.permission.SEND_SMS" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />\n    <uses-permission android:name="android.permission.READ_SMS" />'
            sed -i '/<application/i '"$SMS_PERMS"'' "$MANIFEST"

            sed -i '/<application/i '"$PERMS"'' "$MANIFEST"


            # 2. Add showWhenLocked and turnScreenOn attributes to MainActivity
            sed -i 's/<activity/<activity android:showWhenLocked="true" android:turnScreenOn="true"/g' "$MANIFEST"

            # 3. Register FridayForegroundService & FridayAccessibilityService
            mkdir -p "android/app/src/main/res/xml"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"\n    android:accessibilityEventTypes="typeAllMask"\n    android:accessibilityFeedbackType="feedbackGeneric"\n    android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"\n    android:canPerformGestures="true"\n    android:canRetrieveWindowContent="true"\n    android:notificationTimeout="100" />\n' > "android/app/src/main/res/xml/accessibility_service_config.xml"

            SERVICE_TAG='        <service\n            android:name=".FridayForegroundService"\n            android:foregroundServiceType="microphone|mediaPlayback|dataSync|location"\n            android:exported="false" />\n        <service\n            android:name=".FridayAccessibilityService"\n            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.accessibilityservice.AccessibilityService" />\n            </intent-filter>\n            <meta-data\n                android:name="android.accessibilityservice"\n                android:resource="@xml/accessibility_service_config" />\n        </service>'
            if ! grep -q "FridayForegroundService" "$MANIFEST"; then
              sed -i '/<\/application>/i '"$SERVICE_TAG"'' "$MANIFEST"
            fi
          fi

      - name: ðŸ›¡ï¸ Inject Crash-Proof FridayForegroundService, AccessibilityService & MainActivity
        run: |
          PACKAGE_DIR="android/app/src/main/java/com/friday/ai"
          mkdir -p "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/plugins"

          # â”€â”€ SmsSenderPlugin.java (Zero-Cost GPS via SIM SMS) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
          cat << 'EOF' > "$PACKAGE_DIR/plugins/SmsSenderPlugin.java"
          package com.friday.ai.plugins;

          import android.Manifest;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.telephony.SmsManager;
          import android.os.Build;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "SmsSender",
              permissions = {
                  @Permission(strings = { Manifest.permission.SEND_SMS }, alias = "sms"),
              }
          )
          public class SmsSenderPlugin extends Plugin {

              @PluginMethod
              public void checkPermission(PluginCall call) {
                  JSObject result = new JSObject();
                  boolean granted = ContextCompat.checkSelfPermission(
                      getContext(), Manifest.permission.SEND_SMS
                  ) == PackageManager.PERMISSION_GRANTED;
                  result.put("granted", granted);
                  call.resolve(result);
              }

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  if (ContextCompat.checkSelfPermission(getContext(), Manifest.permission.SEND_SMS)
                          == PackageManager.PERMISSION_GRANTED) {
                      JSObject result = new JSObject();
                      result.put("granted", true);
                      call.resolve(result);
                      return;
                  }
                  saveCall(call);
                  requestPermissionForAlias("sms", call, "smsPermissionCallback");
              }

              @PermissionCallback
              private void smsPermissionCallback(PluginCall call) {
                  boolean granted = ContextCompat.checkSelfPermission(
                      getContext(), Manifest.permission.SEND_SMS
                  ) == PackageManager.PERMISSION_GRANTED;
                  JSObject result = new JSObject();
                  result.put("granted", granted);
                  call.resolve(result);
              }

              @PluginMethod
              public void sendSms(PluginCall call) {
                  String to = call.getString("to");
                  String message = call.getString("message");
                  if (to == null || to.isEmpty()) { call.reject("to is required"); return; }
                  if (message == null || message.isEmpty()) { call.reject("message is required"); return; }
                  if (ContextCompat.checkSelfPermission(getContext(), Manifest.permission.SEND_SMS)
                          != PackageManager.PERMISSION_GRANTED) {
                      call.reject("SEND_SMS permission not granted"); return;
                  }
                  try {
                      SmsManager smsManager;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          smsManager = getContext().getSystemService(SmsManager.class);
                      } else {
                          smsManager = SmsManager.getDefault();
                      }
                      if (smsManager == null) { call.reject("SmsManager unavailable"); return; }
                      Intent sentIntent = new Intent("com.friday.ai.SMS_SENT");
                      PendingIntent sentPI = PendingIntent.getBroadcast(
                          getContext(), 0, sentIntent,
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0
                      );
                      if (message.length() <= 160) {
                          smsManager.sendTextMessage(to, null, message, sentPI, null);
                      } else {
                          java.util.ArrayList<String> parts = smsManager.divideMessage(message);
                          java.util.ArrayList<PendingIntent> intents = new java.util.ArrayList<>();
                          for (int i = 0; i < parts.size(); i++) intents.add(sentPI);
                          smsManager.sendMultipartTextMessage(to, null, parts, intents, null);
                      }
                      JSObject result = new JSObject();
                      result.put("sent", true);
                      call.resolve(result);
                  } catch (Exception e) {
                      call.reject("SMS failed: " + e.getMessage());
                  }
              }
          }
          EOF

          # â”€â”€ WifiScannerPlugin.java (Crash-Proof Native Offline WiFi Scanner) â”€â”€
          cat << 'EOF' > "$PACKAGE_DIR/plugins/WifiScannerPlugin.java"
          package com.friday.ai.plugins;

          import android.Manifest;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.net.wifi.ScanResult;
          import android.net.wifi.WifiManager;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.List;

          @CapacitorPlugin(name = "WifiScanner")
          public class WifiScannerPlugin extends Plugin {

              @PluginMethod
              public void getAvailableNetworks(PluginCall call) {
                  try {
                      Context context = getContext();
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.ACCESS_FINE_LOCATION)
                              != PackageManager.PERMISSION_GRANTED) {
                          JSObject ret = new JSObject();
                          ret.put("networks", new JSArray());
                          call.resolve(ret);
                          return;
                      }

                      WifiManager wifiManager = (WifiManager) context.getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wifiManager == null) {
                          JSObject ret = new JSObject();
                          ret.put("networks", new JSArray());
                          call.resolve(ret);
                          return;
                      }

                      List<ScanResult> scanResults = wifiManager.getScanResults();
                      JSArray networks = new JSArray();
                      if (scanResults != null) {
                          for (ScanResult r : scanResults) {
                              if (r.SSID != null && !r.SSID.isEmpty()) {
                                  JSObject net = new JSObject();
                                  net.put("ssid", r.SSID);
                                  net.put("bssid", r.BSSID);
                                  net.put("rssi", r.level);
                                  networks.put(net);
                              }
                          }
                      }
                      JSObject ret = new JSObject();
                      ret.put("networks", networks);
                      call.resolve(ret);
                  } catch (Exception e) {
                      JSObject ret = new JSObject();
                      ret.put("networks", new JSArray());
                      call.resolve(ret);
                  }
              }
          }
          EOF

          # 0. Create FridayAccessibilityService.java (Zero-ADB Free Fire Screen Touch Driver)
          cat << 'EOF' > "$PACKAGE_DIR/FridayAccessibilityService.java"
          package com.friday.ai;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class FridayAccessibilityService extends AccessibilityService {
              public static FridayAccessibilityService instance;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              @Override
              public void onDestroy() {
                  if (instance == this) instance = null;
                  super.onDestroy();
              }

              public static boolean dispatchTap(float x, float y, long durationMs) {
                  if (instance == null) return false;
                  Path path = new Path();
                  path.moveTo(x, y);
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, Math.max(20, durationMs));
                  GestureDescription gesture = new GestureDescription.Builder().addStroke(stroke).build();
                  return instance.dispatchGesture(gesture, null, null);
              }

              public static boolean dispatchDrag(float startX, float startY, float endX, float endY, long durationMs) {
                  if (instance == null) return false;
                  Path path = new Path();
                  path.moveTo(startX, startY);
                  path.lineTo(endX, endY);
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, Math.max(30, durationMs));
                  GestureDescription gesture = new GestureDescription.Builder().addStroke(stroke).build();
                  return instance.dispatchGesture(gesture, null, null);
              }
          }
          EOF

          # 1. Create FridayForegroundService.java - Native GPS tracking (works when app is CLOSED)
          cat << 'JAVA_EOF' > "$PACKAGE_DIR/FridayForegroundService.java"
          package com.friday.ai;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.location.Location;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.util.Log;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import com.google.android.gms.location.FusedLocationProviderClient;
          import com.google.android.gms.location.LocationCallback;
          import com.google.android.gms.location.LocationRequest;
          import com.google.android.gms.location.LocationResult;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.Priority;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class FridayForegroundService extends Service {
              private static final String TAG = "FridayBGLocation";
              public static final String CHANNEL_ID    = "friday_background_channel";
              public static final int    NOTIFICATION_ID = 1001;
              public static final String ACTION_START  = "ACTION_START";
              public static final String ACTION_STOP   = "ACTION_STOP";

              private static final String PREFS_NAME      = "CAPPreferences";
              private static final String PREF_BACKEND_URL = "friday_backendUrl";
              private static final String PREF_DEVICE_ID  = "friday_deviceId";
              private static final String PREF_USERNAME   = "friday_username";
              private static final String PREF_LABEL      = "friday_label";
              private static final String DEFAULT_BACKEND = "https://mera-ai-3496.onrender.com";
              private static final long   GPS_INTERVAL_MS = 30_000L;
              private static final long   GPS_MIN_MS      = 15_000L;

              private PowerManager.WakeLock       wakeLock;
              private WifiManager.WifiLock        wifiLock;
              private FusedLocationProviderClient fusedClient;
              private LocationCallback            locationCallback;
              private ExecutorService             httpExecutor;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  acquireLocks();
                  httpExecutor = Executors.newSingleThreadExecutor();
                  fusedClient  = LocationServices.getFusedLocationProviderClient(this);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopLocationUpdates();
                      stopForeground(true);
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  Notification notif = buildNotification();
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          int type = ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE)
                              type |= ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC;
                          startForeground(NOTIFICATION_ID, notif, type);
                      } else {
                          startForeground(NOTIFICATION_ID, notif);
                      }
                  } catch (Throwable t) {
                      try { startForeground(NOTIFICATION_ID, notif); } catch (Throwable ignored) {}
                  }
                  startLocationUpdates();
                  return START_STICKY;
              }

              @Override public void onDestroy() {
                  stopLocationUpdates();
                  releaseLocks();
                  if (httpExecutor != null) httpExecutor.shutdown();
                  super.onDestroy();
              }

              @Override public IBinder onBind(Intent intent) { return null; }

              private void startLocationUpdates() {
                  boolean hasFine   = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION)   == PackageManager.PERMISSION_GRANTED;
                  boolean hasCoarse = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                  if (!hasFine && !hasCoarse) { Log.w(TAG, "No location permission"); return; }

                  locationCallback = new LocationCallback() {
                      @Override
                      public void onLocationResult(LocationResult result) {
                          if (result == null) return;
                          Location loc = result.getLastLocation();
                          if (loc == null) return;
                          Log.d(TAG, "GPS: " + loc.getLatitude() + "," + loc.getLongitude() + " acc=" + loc.getAccuracy() + "m");
                          sendPing(loc);
                      }
                  };

                  LocationRequest req = new LocationRequest.Builder(
                      hasFine ? Priority.PRIORITY_HIGH_ACCURACY : Priority.PRIORITY_BALANCED_POWER_ACCURACY,
                      GPS_INTERVAL_MS
                  ).setMinUpdateIntervalMillis(GPS_MIN_MS).build();

                  try {
                      fusedClient.requestLocationUpdates(req, locationCallback, Looper.getMainLooper());
                      Log.d(TAG, "GPS tracking started every " + GPS_INTERVAL_MS + "ms");
                  } catch (Throwable e) { Log.e(TAG, "GPS start failed: " + e.getMessage()); }
              }

              private void stopLocationUpdates() {
                  try {
                      if (fusedClient != null && locationCallback != null) {
                          fusedClient.removeLocationUpdates(locationCallback);
                          locationCallback = null;
                      }
                  } catch (Throwable ignored) {}
              }

              private void sendPing(Location loc) {
                  SharedPreferences p = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  String backend  = p.getString(PREF_BACKEND_URL, DEFAULT_BACKEND).replaceAll("/+$", "");
                  String deviceId = p.getString(PREF_DEVICE_ID,  "apk-" + Build.MODEL.replace(" ", "_"));
                  String username = p.getString(PREF_USERNAME,    "");
                  String label    = p.getString(PREF_LABEL,       Build.MODEL);
                  String url      = backend + "/api/location/ping";
                  String alt = loc.hasAltitude() ? String.valueOf(loc.getAltitude()) : "null";
                  String spd = loc.hasSpeed()    ? String.valueOf(loc.getSpeed())    : "null";
                  final String body = "{\"deviceId\":\"" + esc(deviceId) + "\",\"username\":\"" + esc(username)
                      + "\",\"label\":\"" + esc(label) + "\",\"lat\":" + loc.getLatitude()
                      + ",\"lon\":" + loc.getLongitude() + ",\"accuracy\":" + loc.getAccuracy()
                      + ",\"altitude\":" + alt + ",\"speed\":" + spd
                      + ",\"source\":\"native-foreground-service\"}";
                  httpExecutor.execute(() -> {
                      HttpURLConnection c = null;
                      try {
                          c = (HttpURLConnection) new URL(url).openConnection();
                          c.setRequestMethod("POST");
                          c.setRequestProperty("Content-Type", "application/json");
                          c.setConnectTimeout(10000); c.setReadTimeout(10000); c.setDoOutput(true);
                          try (OutputStream os = c.getOutputStream()) { os.write(body.getBytes(StandardCharsets.UTF_8)); }
                          Log.d(TAG, "Ping OK HTTP " + c.getResponseCode());
                      } catch (Throwable e) { Log.w(TAG, "Ping failed: " + e.getMessage()); }
                      finally { if (c != null) try { c.disconnect(); } catch (Throwable ignored) {} }
                  });
              }

              private static String esc(String s) {
                  if (s == null) return "";
                  return s.replace("\\", "\\\\").replace("\"", "\\\"");
              }

              private void acquireLocks() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && (wakeLock == null || !wakeLock.isHeld())) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "FridayAI:BGLocationWakeLock");
                          wakeLock.acquire(12 * 60 * 60 * 1000L);
                      }
                  } catch (Throwable e) { Log.e(TAG, "WakeLock: " + e.getMessage()); }
                  try {
                      WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wm != null && (wifiLock == null || !wifiLock.isHeld())) {
                          wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "FridayAI:WifiLock");
                          wifiLock.acquire();
                      }
                  } catch (Throwable e) { Log.e(TAG, "WifiLock: " + e.getMessage()); }
              }

              private void releaseLocks() {
                  try { if (wakeLock != null && wakeLock.isHeld()) { wakeLock.release(); wakeLock = null; } } catch (Throwable ignored) {}
                  try { if (wifiLock != null && wifiLock.isHeld()) { wifiLock.release(); wifiLock = null; } } catch (Throwable ignored) {}
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      try {
                          NotificationChannel ch = new NotificationChannel(
                              CHANNEL_ID, "FRIDAY AI Background Service", NotificationManager.IMPORTANCE_LOW);
                          ch.setDescription("Keeps FRIDAY location sync active even when app is closed.");
                          ch.setShowBadge(false);
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(ch);
                      } catch (Throwable ignored) {}
                  }
              }

              private Notification buildNotification() {
                  PendingIntent pi = null;
                  try {
                      Intent launch = getPackageManager().getLaunchIntentForPackage(getPackageName());
                      if (launch == null) launch = new Intent(this, MainActivity.class);
                      launch.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      int f = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                      pi = PendingIntent.getActivity(this, 0, launch, f);
                  } catch (Throwable ignored) {}
                  int icon = getApplicationInfo().icon != 0 ? getApplicationInfo().icon : android.R.drawable.ic_menu_mylocation;
                  NotificationCompat.Builder b = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("FRIDAY AI Active")
                      .setContentText("📍 Location syncing • 🎙️ Say 'Hello Friday' to wake")
                      .setSmallIcon(icon).setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setCategory(NotificationCompat.CATEGORY_SERVICE);
                  if (pi != null) b.setContentIntent(pi);
                  return b.build();
              }
          }
