name: Build & Package FRIDAY Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (FRIDAY.apk)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Required for Capacitor 7 / Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies & Capacitor CLI
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ⚡ Build Web Assets (Vite Production Build)
        run: npm run build
        env:
          VITE_BACKEND_URL: https://mera-ai-3496.onrender.com

      - name: 📱 Initialize & Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔧 Fix Background-Runner AAR (android-js-engine-release.aar)
        run: |
          # capacitor-background-runner needs android-js-engine-release.aar in two locations.
          # cap sync doesn't always place it correctly in CI — fix manually.
          AAR_SRC=$(find node_modules/@capacitor/background-runner -name "android-js-engine-release.aar" 2>/dev/null | head -1)
          echo "AAR source: $AAR_SRC"

          if [ -n "$AAR_SRC" ]; then
            # Location 1: cordova-android-plugins libs
            mkdir -p android/capacitor-cordova-android-plugins/src/android/libs
            cp "$AAR_SRC" android/capacitor-cordova-android-plugins/src/android/libs/android-js-engine-release.aar
            echo "✅ Copied AAR → cordova-android-plugins/libs"

            # Location 2: app/libs (fallback lookup)
            mkdir -p android/app/libs
            cp "$AAR_SRC" android/app/libs/android-js-engine-release.aar
            echo "✅ Copied AAR → app/libs"
          else
            echo "⚠️ android-js-engine-release.aar not found in node_modules — background-runner may be missing"
            find node_modules/@capacitor/background-runner -type f 2>/dev/null | head -20 || true
          fi

          # Also ensure local.properties has sdk.dir set (needed in some CI environments)
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "✅ local.properties written: sdk.dir=$ANDROID_HOME"

      - name: 🛠️ Fix Gradle — Revert AGP & Force Compatible androidx.core Version
        run: |
          APP_GRADLE="android/app/build.gradle"
          ROOT_GRADLE="android/build.gradle"
          VARS_GRADLE="android/variables.gradle"
          PROP="android/gradle.properties"

          # ── 1. Jetifier & AndroidX ────────────────────────────────────────────
          if [ -f "$PROP" ]; then
            grep -q "android.enableJetifier" "$PROP" || echo "android.enableJetifier=true" >> "$PROP"
            grep -q "android.useAndroidX"    "$PROP" || echo "android.useAndroidX=true"    >> "$PROP"
          fi

          # ── 2. Revert AGP to 8.7.2 (stable, compileSdk 35 compatible) ────────
          # Root cause: core-ktx:1.17.0 needs AGP 8.9.1+ but that chain of
          # upgrades is fragile. Instead we pin core-ktx to 1.13.1 (step 4).
          if [ -f "$ROOT_GRADLE" ]; then
            sed -i "s/com.android.tools.build:gradle:[0-9.]\+/com.android.tools.build:gradle:8.7.2/g" "$ROOT_GRADLE"
            echo "✅ AGP pinned → 8.7.2"
          fi

          # ── 3. Keep compileSdk at 35 (AGP 8.7.2 supports up to 35) ──────────
          # Capacitor 6+ stores compileSdkVersion in variables.gradle NOT app/build.gradle
          if [ -f "$VARS_GRADLE" ]; then
            sed -i 's/compileSdkVersion\s*=\s*[0-9]\+/compileSdkVersion = 35/g' "$VARS_GRADLE"
            sed -i 's/targetSdkVersion\s*=\s*[0-9]\+/targetSdkVersion = 35/g'   "$VARS_GRADLE"
            echo "✅ variables.gradle → compileSdkVersion=35, targetSdkVersion=35"
            cat "$VARS_GRADLE"
          fi
          # Also patch app/build.gradle in case literals exist there
          if [ -f "$APP_GRADLE" ]; then
            sed -i 's/compileSdk\s\+[0-9]\+/compileSdk 35/g'         "$APP_GRADLE"
            sed -i 's/compileSdkVersion\s\+[0-9]\+/compileSdkVersion 35/g' "$APP_GRADLE"
            sed -i 's/targetSdk\s\+[0-9]\+/targetSdk 35/g'           "$APP_GRADLE"
            sed -i 's/targetSdkVersion\s\+[0-9]\+/targetSdkVersion 35/g'   "$APP_GRADLE"
          fi

          # ── 4. Force core-ktx:1.13.1 — KEY FIX ──────────────────────────────
          # core-ktx:1.17.0 (pulled by capacitor plugins) needs AGP 8.9.1+
          # and compileSdk 36 — way too new. Pin to 1.13.1 which is:
          #   ✅ compileSdk 35 compatible
          #   ✅ AGP 8.7.x compatible
          #   ✅ Production stable (used by millions of apps)
          if [ -f "$APP_GRADLE" ]; then
            cat >> "$APP_GRADLE" << 'GRADLE_EOF'

// ── FRIDAY CI: Dependency Version Resolution Fixes ─────────────────────────
configurations.all {
    resolutionStrategy {
        // Pin androidx.core to 1.13.1 (stable, API-35, AGP-8.7 compatible)
        // Prevents: core-ktx:1.17.0 → AGP 8.9.1+ requirement chain
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.core:core:1.13.1'

        // Kotlin stdlib deduplication (prevents duplicate class errors)
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because('kotlin-stdlib-jdk7 is now part of kotlin-stdlib')
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because('kotlin-stdlib-jdk8 is now part of kotlin-stdlib')
        }
    }
}
GRADLE_EOF
            echo "✅ Resolution strategy written → core-ktx:1.13.1 + kotlin-stdlib:1.8.22"
          fi

          # ── 5. Verify final state ─────────────────────────────────────────────
          echo "── android/build.gradle (AGP version) ──"
          grep "com.android.tools.build" "$ROOT_GRADLE" || true
          echo "── android/variables.gradle ──"
          cat "$VARS_GRADLE" 2>/dev/null || echo "(not found)"

      - name: 🔑 Configure Permissions & Android 14/15 Foreground Service in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # 1. Add All Required Android Permissions (100% Android 14/15 Compliant)
            PERMS='    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />'
            
            # Remove any duplicate permissions before re-injecting
            sed -i '/android.permission.INTERNET/d' "$MANIFEST"
            sed -i '/android.permission.RECORD_AUDIO/d' "$MANIFEST"
            sed -i '/android.permission.SEND_SMS/d' "$MANIFEST"
            sed -i '/android.permission.RECEIVE_SMS/d' "$MANIFEST"
            sed -i '/android.permission.READ_SMS/d' "$MANIFEST"

            # Add SEND_SMS / RECEIVE_SMS permissions for zero-cost SMS location fallback
            SMS_PERMS='    <uses-permission android:name="android.permission.SEND_SMS" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />\n    <uses-permission android:name="android.permission.READ_SMS" />'
            sed -i '/<application/i '"$SMS_PERMS"'' "$MANIFEST"

            sed -i '/<application/i '"$PERMS"'' "$MANIFEST"


            # 2. Add showWhenLocked and turnScreenOn attributes to MainActivity
            sed -i 's/<activity/<activity android:showWhenLocked="true" android:turnScreenOn="true"/g' "$MANIFEST"

            # 3. Register FridayForegroundService & FridayAccessibilityService
            mkdir -p "android/app/src/main/res/xml"
            printf '<?xml version="1.0" encoding="utf-8"?>\n<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"\n    android:accessibilityEventTypes="typeAllMask"\n    android:accessibilityFeedbackType="feedbackGeneric"\n    android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"\n    android:canPerformGestures="true"\n    android:canRetrieveWindowContent="true"\n    android:notificationTimeout="100" />\n' > "android/app/src/main/res/xml/accessibility_service_config.xml"

            SERVICE_TAG='        <service\n            android:name=".FridayForegroundService"\n            android:foregroundServiceType="microphone|mediaPlayback|dataSync|location"\n            android:exported="false" />\n        <service\n            android:name=".FridayAccessibilityService"\n            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.accessibilityservice.AccessibilityService" />\n            </intent-filter>\n            <meta-data\n                android:name="android.accessibilityservice"\n                android:resource="@xml/accessibility_service_config" />\n        </service>'
            if ! grep -q "FridayForegroundService" "$MANIFEST"; then
              sed -i '/<\/application>/i '"$SERVICE_TAG"'' "$MANIFEST"
            fi
          fi

      - name: 🛡️ Inject Crash-Proof FridayForegroundService, AccessibilityService & MainActivity
        run: |
          PACKAGE_DIR="android/app/src/main/java/com/friday/ai"
          mkdir -p "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/plugins"

          # ── SmsSenderPlugin.java (Zero-Cost GPS via SIM SMS) ──────────────────
          cat << 'EOF' > "$PACKAGE_DIR/plugins/SmsSenderPlugin.java"
          package com.friday.ai.plugins;

          import android.Manifest;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.telephony.SmsManager;
          import android.os.Build;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "SmsSender",
              permissions = {
                  @Permission(strings = { Manifest.permission.SEND_SMS }, alias = "sms"),
              }
          )
          public class SmsSenderPlugin extends Plugin {

              @PluginMethod
              public void checkPermission(PluginCall call) {
                  JSObject result = new JSObject();
                  boolean granted = ContextCompat.checkSelfPermission(
                      getContext(), Manifest.permission.SEND_SMS
                  ) == PackageManager.PERMISSION_GRANTED;
                  result.put("granted", granted);
                  call.resolve(result);
              }

              @PluginMethod
              public void requestPermission(PluginCall call) {
                  if (ContextCompat.checkSelfPermission(getContext(), Manifest.permission.SEND_SMS)
                          == PackageManager.PERMISSION_GRANTED) {
                      JSObject result = new JSObject();
                      result.put("granted", true);
                      call.resolve(result);
                      return;
                  }
                  saveCall(call);
                  requestPermissionForAlias("sms", call, "smsPermissionCallback");
              }

              @PermissionCallback
              private void smsPermissionCallback(PluginCall call) {
                  boolean granted = ContextCompat.checkSelfPermission(
                      getContext(), Manifest.permission.SEND_SMS
                  ) == PackageManager.PERMISSION_GRANTED;
                  JSObject result = new JSObject();
                  result.put("granted", granted);
                  call.resolve(result);
              }

              @PluginMethod
              public void sendSms(PluginCall call) {
                  String to = call.getString("to");
                  String message = call.getString("message");
                  if (to == null || to.isEmpty()) { call.reject("to is required"); return; }
                  if (message == null || message.isEmpty()) { call.reject("message is required"); return; }
                  if (ContextCompat.checkSelfPermission(getContext(), Manifest.permission.SEND_SMS)
                          != PackageManager.PERMISSION_GRANTED) {
                      call.reject("SEND_SMS permission not granted"); return;
                  }
                  try {
                      SmsManager smsManager;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          smsManager = getContext().getSystemService(SmsManager.class);
                      } else {
                          smsManager = SmsManager.getDefault();
                      }
                      if (smsManager == null) { call.reject("SmsManager unavailable"); return; }
                      Intent sentIntent = new Intent("com.friday.ai.SMS_SENT");
                      PendingIntent sentPI = PendingIntent.getBroadcast(
                          getContext(), 0, sentIntent,
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0
                      );
                      if (message.length() <= 160) {
                          smsManager.sendTextMessage(to, null, message, sentPI, null);
                      } else {
                          java.util.ArrayList<String> parts = smsManager.divideMessage(message);
                          java.util.ArrayList<PendingIntent> intents = new java.util.ArrayList<>();
                          for (int i = 0; i < parts.size(); i++) intents.add(sentPI);
                          smsManager.sendMultipartTextMessage(to, null, parts, intents, null);
                      }
                      JSObject result = new JSObject();
                      result.put("sent", true);
                      call.resolve(result);
                  } catch (Exception e) {
                      call.reject("SMS failed: " + e.getMessage());
                  }
              }
          }
          EOF

          # 0. Create FridayAccessibilityService.java (Zero-ADB Free Fire Screen Touch Driver)
          cat << 'EOF' > "$PACKAGE_DIR/FridayAccessibilityService.java"
          package com.friday.ai;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class FridayAccessibilityService extends AccessibilityService {
              public static FridayAccessibilityService instance;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              @Override
              public void onDestroy() {
                  if (instance == this) instance = null;
                  super.onDestroy();
              }

              public static boolean dispatchTap(float x, float y, long durationMs) {
                  if (instance == null) return false;
                  Path path = new Path();
                  path.moveTo(x, y);
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, Math.max(20, durationMs));
                  GestureDescription gesture = new GestureDescription.Builder().addStroke(stroke).build();
                  return instance.dispatchGesture(gesture, null, null);
              }

              public static boolean dispatchDrag(float startX, float startY, float endX, float endY, long durationMs) {
                  if (instance == null) return false;
                  Path path = new Path();
                  path.moveTo(startX, startY);
                  path.lineTo(endX, endY);
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, Math.max(30, durationMs));
                  GestureDescription gesture = new GestureDescription.Builder().addStroke(stroke).build();
                  return instance.dispatchGesture(gesture, null, null);
              }
          }
          EOF

          # 1. Create FridayForegroundService.java (100% Crash-Proof & Android 14/15 Compliant)
          cat << 'EOF' > "$PACKAGE_DIR/FridayForegroundService.java"
          package com.friday.ai;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          public class FridayForegroundService extends Service {
              public static final String CHANNEL_ID = "friday_background_channel";
              public static final int NOTIFICATION_ID = 1001;
              public static final String ACTION_START = "ACTION_START";
              public static final String ACTION_STOP = "ACTION_STOP";

              private PowerManager.WakeLock wakeLock;
              private WifiManager.WifiLock wifiLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  acquireLocks();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopForeground(true);
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  Notification notification = buildForegroundNotification();
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          int serviceType = ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE | ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                              serviceType |= ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC;
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              serviceType |= ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION;
                          }
                          startForeground(NOTIFICATION_ID, notification, serviceType);
                      } else {
                          startForeground(NOTIFICATION_ID, notification);
                      }
                  } catch (Throwable t) {
                      try {
                          startForeground(NOTIFICATION_ID, notification);
                      } catch (Throwable ignored) {}
                  }

                  return START_STICKY;
              }

              private void acquireLocks() {
                  try {
                      PowerManager powerManager = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (powerManager != null && (wakeLock == null || !wakeLock.isHeld())) {
                          wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "FridayAI:BackgroundWakeLock");
                          wakeLock.acquire(12 * 60 * 60 * 1000L);
                      }
                      WifiManager wifiManager = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wifiManager != null && (wifiLock == null || !wifiLock.isHeld())) {
                          wifiLock = wifiManager.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "FridayAI:WifiLock");
                          wifiLock.acquire();
                      }
                  } catch (Throwable e) {
                      e.printStackTrace();
                  }
              }

              private void releaseLocks() {
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) {
                          wakeLock.release();
                          wakeLock = null;
                      }
                      if (wifiLock != null && wifiLock.isHeld()) {
                          wifiLock.release();
                          wifiLock = null;
                      }
                  } catch (Throwable e) {
                      e.printStackTrace();
                  }
              }

              private void createNotificationChannel() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "FRIDAY AI Background & Call Service",
                              NotificationManager.IMPORTANCE_LOW
                          );
                          channel.setDescription("Keeps Friday AI active for wake word detection, live voice calls, music playback, and background AI tasks.");
                          NotificationManager manager = getSystemService(NotificationManager.class);
                          if (manager != null) {
                              manager.createNotificationChannel(channel);
                          }
                      }
                  } catch (Throwable e) {
                      e.printStackTrace();
                  }
              }

              private Notification buildForegroundNotification() {
                  PendingIntent pendingIntent = null;
                  try {
                      Intent launchIntent = getPackageManager().getLaunchIntentForPackage(getPackageName());
                      if (launchIntent == null) {
                          launchIntent = new Intent(this, MainActivity.class);
                      }
                      launchIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      pendingIntent = PendingIntent.getActivity(
                          this,
                          0,
                          launchIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0)
                      );
                  } catch (Throwable ignored) {}

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("FRIDAY AI Active")
                      .setContentText("🎙️ Live Voice Calling & AI Intelligence Ready • 'Hello Friday'")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setCategory(NotificationCompat.CATEGORY_SERVICE);

                  if (pendingIntent != null) {
                      builder.setContentIntent(pendingIntent);
                  }

                  return builder.build();
              }

              @Override
              public void onDestroy() {
                  releaseLocks();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 2. Update MainActivity.java (Crash-Proof, Safe Permission Requests & WebView Init)
          cat << 'EOF' > "$PACKAGE_DIR/MainActivity.java"
          package com.friday.ai;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.friday.ai.plugins.SmsSenderPlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  // Register native Capacitor plugins
                  registerPlugin(SmsSenderPlugin.class);
                  super.onCreate(savedInstanceState);

                  // 1. Safe Screen & Lockscreen Wake Flags
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                          setShowWhenLocked(true);
                          setTurnScreenOn(true);
                      } else {
                          getWindow().addFlags(
                              WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                              WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD |
                              WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |
                              WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          );
                      }
                  } catch (Throwable e) {
                      e.printStackTrace();
                  }

                  // 2. Safe Runtime Permissions Request (Only request ungranted permissions)
                  requestAppPermissions();

                  // 3. Start Foreground Service safely after a slight delay so Android has initialized
                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          startFridayBackgroundService();
                          configureWebViewSettings();
                      }
                  }, 800);
              }

              private void requestAppPermissions() {
                  try {
                      java.util.List<String> permsNeeded = new java.util.ArrayList<>();
                      
                      if (ContextCompat.checkSelfPermission(this, android.Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          permsNeeded.add(android.Manifest.permission.RECORD_AUDIO);
                      }
                      if (ContextCompat.checkSelfPermission(this, android.Manifest.permission.MODIFY_AUDIO_SETTINGS) != PackageManager.PERMISSION_GRANTED) {
                          permsNeeded.add(android.Manifest.permission.MODIFY_AUDIO_SETTINGS);
                      }
                      if (ContextCompat.checkSelfPermission(this, android.Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          permsNeeded.add(android.Manifest.permission.ACCESS_FINE_LOCATION);
                      }
                      if (ContextCompat.checkSelfPermission(this, android.Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          permsNeeded.add(android.Manifest.permission.ACCESS_COARSE_LOCATION);
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          if (ContextCompat.checkSelfPermission(this, android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                              permsNeeded.add(android.Manifest.permission.POST_NOTIFICATIONS);
                          }
                      }

                      if (!permsNeeded.isEmpty()) {
                          ActivityCompat.requestPermissions(this, permsNeeded.toArray(new String[0]), 101);
                      }
                  } catch (Throwable e) {
                      e.printStackTrace();
                  }
              }

              private void startFridayBackgroundService() {
                  try {
                      Intent serviceIntent = new Intent(this, FridayForegroundService.class);
                      serviceIntent.setAction(FridayForegroundService.ACTION_START);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  } catch (Throwable e) {
                      e.printStackTrace();
                  }
              }

              private void configureWebViewSettings() {
                  try {
                      if (this.getBridge() != null) {
                          WebView webView = this.getBridge().getWebView();
                          if (webView != null) {
                              WebSettings settings = webView.getSettings();
                              settings.setMediaPlaybackRequiresUserGesture(false);
                              settings.setJavaScriptEnabled(true);
                              settings.setDomStorageEnabled(true);
                              settings.setDatabaseEnabled(true);
                              settings.setGeolocationEnabled(true);

                              webView.setWebChromeClient(new android.webkit.WebChromeClient() {
                                  @Override
                                  public void onPermissionRequest(final android.webkit.PermissionRequest request) {
                                      MainActivity.this.runOnUiThread(new Runnable() {
                                          @Override
                                          public void run() {
                                              try {
                                                  request.grant(request.getResources());
                                              } catch (Throwable e) {
                                                  e.printStackTrace();
                                              }
                                          }
                                      });
                                  }

                                  @Override
                                  public void onGeolocationPermissionsShowPrompt(String origin, android.webkit.GeolocationPermissions.Callback callback) {
                                      callback.invoke(origin, true, false);
                                  }
                              });

                              // Expose Friday Touch Bridge to Web App
                              webView.addJavascriptInterface(new Object() {
                                  @android.webkit.JavascriptInterface
                                  public boolean dispatchTap(float x, float y, long duration) {
                                      return FridayAccessibilityService.dispatchTap(x, y, duration);
                                  }

                                  @android.webkit.JavascriptInterface
                                  public boolean dispatchDrag(float sx, float sy, float ex, float ey, long duration) {
                                      return FridayAccessibilityService.dispatchDrag(sx, sy, ex, ey, duration);
                                  }

                                  @android.webkit.JavascriptInterface
                                  public boolean isAccessibilityActive() {
                                      return FridayAccessibilityService.instance != null;
                                  }
                              }, "AndroidGamingBridge");
                          }
                      }
                  } catch (Throwable e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      - name: 🔨 Build FRIDAY Main AI APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 🎮 Build Friday Touch Helper Standalone APK via Gradle
        run: |
          cd android-helper
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f "../android/gradlew" ]; then
            cp ../android/gradlew ./gradlew
            mkdir -p gradle
            cp -r ../android/gradle/wrapper ./gradle/
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare & Rename Both APKs
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/FRIDAY.apk
          cp android-helper/app/build/outputs/apk/debug/app-debug.apk apk-output/FridayTouchHelper.apk
          echo "Generated APK Files:"
          ls -lh apk-output/

      - name: 📤 Upload FRIDAY.apk (Main AI Live Agent App)
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Main-App
          path: apk-output/FRIDAY.apk
          retention-days: 30

      - name: 📤 Upload FridayTouchHelper.apk (Touch Helper App)
        uses: actions/upload-artifact@v4
        with:
          name: Friday-Touch-Helper
          path: apk-output/FridayTouchHelper.apk
          retention-days: 30

      - name: 🚀 Attach Both APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk-output/FRIDAY.apk
            apk-output/FridayTouchHelper.apk
          name: FRIDAY AI Mobile & Touch Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
