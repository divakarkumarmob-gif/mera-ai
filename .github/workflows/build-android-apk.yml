name: Build & Package FRIDAY Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (FRIDAY.apk)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Required for Capacitor 7 / Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies & Capacitor CLI
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ⚡ Build Web Assets (Vite Production Build)
        run: npm run build

      - name: 📱 Initialize & Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🛠️ Fix Kotlin Duplicate Classes & Configure Gradle
        run: |
          # 1. Enable Jetifier & AndroidX in gradle.properties
          PROP="android/gradle.properties"
          if [ -f "$PROP" ]; then
            echo "android.enableJetifier=true" >> "$PROP"
            echo "android.useAndroidX=true" >> "$PROP"
          fi

          # 2. Add Kotlin stdlib resolution constraints to android/app/build.gradle
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            cat << 'EOF' >> "$APP_GRADLE"

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }
}
EOF
          fi

      - name: 🔑 Configure Permissions in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Add RECORD_AUDIO and MODIFY_AUDIO_SETTINGS if not already present
            if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
            fi
          fi

      - name: 🔨 Build Debug APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Prepare & Rename FRIDAY.apk
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/FRIDAY.apk
          echo "FRIDAY.apk size:"
          ls -lh apk-output/FRIDAY.apk

      - name: 📤 Upload Downloadable FRIDAY.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Android-APK
          path: apk-output/FRIDAY.apk
          retention-days: 30

      - name: 🚀 Attach FRIDAY.apk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/FRIDAY.apk
          name: FRIDAY AI Mobile Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
