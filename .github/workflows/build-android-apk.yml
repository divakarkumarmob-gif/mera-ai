name: Build & Package FRIDAY Native Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Pure Native Kotlin FRIDAY.apk
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies & Build Friday Web Assets
        run: |
          npm install
          npm run build
        env:
          VITE_BACKEND_URL: https://mera-ai-3496.onrender.com

      - name: 📁 Bundle Web Assets into Android APK Assets
        run: |
          mkdir -p android/app/src/main/assets
          # Clean previous assets folder completely so no stale JS/CSS or duplicate files remain
          rm -rf android/app/src/main/assets/*
          # Copy fresh web build output directly to assets root
          cp -r dist/* android/app/src/main/assets/
          # Exclude Node.js backend server code and sourcemaps (not used in Android APK)
          rm -f android/app/src/main/assets/server.cjs android/app/src/main/assets/server.cjs.map
          # Exclude unused large 3D models
          rm -f android/app/src/main/assets/iPhone+14+Pro.fbx
          echo "✅ Clean bundled assets verified:"
          ls -lh android/app/src/main/assets/

      - name: 🐘 Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🛠️ Generate Gradle Wrapper & Build FRIDAY Native APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🎮 Build Friday Touch Helper Standalone APK (Optional)
        continue-on-error: true
        working-directory: android-helper
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f "../android/gradlew" ]; then
            cp ../android/gradlew ./gradlew
            mkdir -p gradle
            cp -r ../android/gradle/wrapper ./gradle/
          fi
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon || true

      - name: 📦 Prepare Output APKs
        run: |
          mkdir -p apk-output
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/FRIDAY.apk
            echo "✅ FRIDAY.apk generated successfully"
          else
            echo "❌ FRIDAY app-debug.apk not found!"
            find android/app/build -name "*.apk" || true
            exit 1
          fi

          if [ -f "android-helper/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android-helper/app/build/outputs/apk/debug/app-debug.apk apk-output/FridayTouchHelper.apk
            echo "✅ FridayTouchHelper.apk generated successfully"
          fi

          echo "Generated APK Files:"
          ls -lh apk-output/

      - name: 📤 Upload FRIDAY.apk (Native AI & Bluetooth Live Agent)
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Native-App
          path: apk-output/FRIDAY.apk
          retention-days: 30

      - name: 📤 Upload FridayTouchHelper.apk (Touch Helper App)
        if: hashFiles('apk-output/FridayTouchHelper.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Friday-Touch-Helper
          path: apk-output/FridayTouchHelper.apk
          retention-days: 30

      - name: 🚀 Attach Both APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk-output/FRIDAY.apk
            apk-output/FridayTouchHelper.apk
          name: FRIDAY AI Native Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
